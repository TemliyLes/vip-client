server {
    listen 80;
    listen [::]:80;
    server_name vip-client.duckdns.org;
    add_header X-Robots-Tag "noindex, nofollow, noimageindex" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://paliy.cz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vip-client.duckdns.org;
    add_header X-Robots-Tag "noindex, nofollow, noimageindex" always;
    ssl_certificate /etc/letsencrypt/live/vip-client.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vip-client.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://paliy.cz$request_uri;
}

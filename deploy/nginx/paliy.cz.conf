map $arg_rest_route $paliy_backend {
    ""      http://127.0.0.1:3001;
    default http://127.0.0.1:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name paliy.cz www.paliy.cz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://paliy.cz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.paliy.cz;
    ssl_certificate /etc/letsencrypt/live/paliy.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paliy.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://paliy.cz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name paliy.cz;
    ssl_certificate /etc/letsencrypt/live/paliy.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paliy.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /wp-admin {
        return 301 /wp-admin/;
    }

    location ~ ^/(wp-admin/|wp-login\.php$|wp-includes/|wp-json/|wp-content/) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass $paliy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
